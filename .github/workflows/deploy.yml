name: 3-Tier Web App CI/CD to Private Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-private-server:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Deploy Script on AWS Private Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRIVATE_SERVER_IP }}
          username: ${{ secrets.PRIVATE_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_URL,FRONTEND_URL
          script: |
            # সঠিক নেস্টেড ফোল্ডারে প্রবেশ করা
            cd ~/projects/single-server-3tier-webapp/single-server-3tier-webapp
            
            export DB_URL="${{ secrets.DATABASE_URL }}"
            export FRONTEND_URL="${{ secrets.PUBLIC_DOMAIN_OR_IP }}"
            ./deploy.sh

            