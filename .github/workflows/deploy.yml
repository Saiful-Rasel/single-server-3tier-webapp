
name: Deploy 3-Tier App via AWS SSM

on:
  push:
    branches:
      - main

# Prevent overlapping production deployments.
concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ==========================================================
  # CI: Build frontend + package backend + upload to S3
  # ==========================================================

  build:
    name: Build and Upload Artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --------------------------------------------------------
      # 3. Build frontend
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          set -euo pipefail

          test -f frontend/dist/index.html

          echo "Frontend build verified."

      # --------------------------------------------------------
      # 4. Package backend with production dependencies
      # --------------------------------------------------------

      - name: Package backend
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backend-package/backend

          # Copy backend source without secrets or local dependencies.
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='logs' \
            backend/ backend-package/backend/

          # Install production dependencies in the package directory.
          cd backend-package/backend

          npm ci --omit=dev

          cd ../..

          # Build archive with backend/ as its root directory.
          tar -czf backend.tar.gz \
            -C backend-package \
            backend

          test -s backend.tar.gz

          echo "Backend archive created successfully."

      # --------------------------------------------------------
      # 5. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------------------------------
      # 6. Upload frontend artifact
      # --------------------------------------------------------

      - name: Upload frontend artifact to S3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          ARTIFACT_URI="s3://${DEPLOY_BUCKET}/frontend/${COMMIT_SHA}/"

          aws s3 sync \
            frontend/dist/ \
            "$ARTIFACT_URI" \
            --region "$AWS_REGION" \
            --only-show-errors

          echo "Frontend uploaded: $ARTIFACT_URI"

      # --------------------------------------------------------
      # 7. Upload backend archive
      # --------------------------------------------------------

      - name: Upload backend archive to S3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          aws s3 cp \
            backend.tar.gz \
            "s3://${DEPLOY_BUCKET}/backend/${COMMIT_SHA}/backend.tar.gz" \
            --region "$AWS_REGION" \
            --only-show-errors

          echo "Backend archive uploaded."

      # --------------------------------------------------------
      # 8. Upload deployment script
      # --------------------------------------------------------

      - name: Upload deploy.sh to S3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          test -f deploy.sh

          aws s3 cp \
            deploy.sh \
            "s3://${DEPLOY_BUCKET}/backend/${COMMIT_SHA}/deploy.sh" \
            --region "$AWS_REGION" \
            --only-show-errors

          echo "Deployment script uploaded."

  # ==========================================================
  # CD: Deploy artifacts to private EC2 using AWS SSM
  # ==========================================================

  deploy:
    name: Deploy to Private EC2
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # 1. Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------------------------------
      # 2. Deploy through AWS SSM
      # --------------------------------------------------------

      - name: Deploy through AWS SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}

        shell: bash
        run: |
          set -euo pipefail

          echo "Starting SSM deployment..."
          echo "Instance: $INSTANCE_ID"
          echo "Commit: $COMMIT_SHA"

          DEPLOY_SCRIPT_URI="s3://${DEPLOY_BUCKET}/backend/${COMMIT_SHA}/deploy.sh"

          # Execute the deployment script as root through SSM.
          COMMANDS=$(jq -nc \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg sha "$COMMIT_SHA" \
            --arg region "$AWS_REGION" \
            --arg script_uri "$DEPLOY_SCRIPT_URI" \
            '{
              commands: [
                (
                  "set -euo pipefail\n"
                  + "DEPLOY_SCRIPT=/tmp/bmi-deploy-" + $sha + ".sh\n"
                  + "aws s3 cp " + ($script_uri | @sh)
                  + " \"$DEPLOY_SCRIPT\" --region " + ($region | @sh)
                  + " --only-show-errors\n"
                  + "chmod 700 \"$DEPLOY_SCRIPT\"\n"
                  + "export DEPLOY_BUCKET=" + ($bucket | @sh) + "\n"
                  + "export COMMIT_SHA=" + ($sha | @sh) + "\n"
                  + "export AWS_REGION=" + ($region | @sh) + "\n"
                  + "bash \"$DEPLOY_SCRIPT\""
                )
              ]
            }')

          # Send command to private EC2.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --comment "Application deployment: $COMMIT_SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment result (maximum 15 minutes).
          for i in $(seq 1 180); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment completed successfully!"
                exit 0
                ;;

              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)

                echo "Deployment failed!"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json || true

                exit 1
                ;;

            esac

            sleep 5
          done

          echo "Deployment polling timed out."
          exit 1
