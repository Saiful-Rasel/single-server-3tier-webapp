name: 3-Tier Web App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # cache বন্ধ রাখা হয়েছে যাতে লক ফাইল না থাকার কারণে কোনো এরর না দেয়

      # --- 1. DEPENDENCY INSTALLATION & BUILD (CI PHASE) ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # --- 2. BACKEND SETUP & PM2 DEPLOYMENT ---
      - name: Configure Backend Environment (.env)
        working-directory: ./backend
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=production" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "FRONTEND_URL=${{ secrets.PUBLIC_DOMAIN_OR_IP }}" >> .env

      - name: Manage Backend with PM2
        working-directory: ./backend
        run: |
          sudo npm install -g pm2 || true
          pm2 describe bmi-backend > /dev/null && pm2 restart bmi-backend || pm2 start src/server.js --name "bmi-backend"
          pm2 save

      # --- 3. NGINX INSTALLATION & FRONTEND DEPLOYMENT (CD PHASE) ---
      - name: Install and Configure Nginx
        run: |
          if ! dpkg -l | grep -q nginx; then
            echo "Nginx not found. Installing Nginx..."
            sudo apt update -y
            sudo apt install -y nginx
          else
            echo "Nginx is already installed."
          fi
          
          sudo systemctl start nginx
          sudo systemctl enable nginx

          sudo mkdir -p /var/www/bmi-frontend
          sudo chown -R $USER:$USER /var/www/bmi-frontend

      - name: Deploy Frontend Files to Nginx Directory
        run: |
          sudo rm -rf /var/www/bmi-frontend/*
          sudo cp -r frontend/dist/* /var/www/bmi-frontend/
          sudo chown -R www-data:www-data /var/www/bmi-frontend

      # --- 4. NGINX REVERSE PROXY SETUP ---
      - name: Setup Nginx Server Block
        run: |
          sudo bash -c 'cat > /etc/nginx/sites-available/default << '\''EOF'\''
          server {
              listen 80;
              server_name _;

              root /var/www/bmi-frontend;
              index index.html index.htm;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /api/ {
                  proxy_pass http://localhost:3000/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection '\''upgrade'\'';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          '\'

      - name: Test Nginx Configuration and Reload
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
          echo "CI/CD Pipeline and Deployment completed successfully!"