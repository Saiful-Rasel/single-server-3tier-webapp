name: 3-Tier Web App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # --- 1. INSTALL NGINX & SETUP WEB ROOT ---
      - name: Install and Configure Nginx
        run: |
          if ! dpkg -l | grep -q nginx; then
            echo "Nginx not found. Installing Nginx..."
            sudo apt update -y
            sudo apt install -y nginx
          else
            echo "Nginx is already installed."
          fi
          
          # Nginx সার্ভিস স্টার্ট ও এনাবল করা
          sudo systemctl start nginx
          sudo systemctl enable nginx

          # ফন্টএন্ডের জন্য ওয়েব রুট ফোল্ডার তৈরি ও পারমিশন দেওয়া
          sudo mkdir -p /var/www/bmi-frontend
          sudo chown -R $USER:$USER /var/www/bmi-frontend

      # --- 2. BACKEND DEPLOYMENT ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Configure Backend Environment (.env)
        working-directory: ./backend
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=production" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "FRONTEND_URL=${{ secrets.PUBLIC_DOMAIN_OR_IP }}" >> .env

      - name: Manage Backend with PM2
        working-directory: ./backend
        run: |
          # PM2 গ্লোবালি ইন্সটল না থাকলে করে নেওয়া
          sudo npm install -g pm2 || true
          
          # PM2 দিয়ে ব্যাকএন্ড প্রসেস স্টার্ট বা রিস্টার্ট করা
          pm2 describe bmi-backend > /dev/null && pm2 restart bmi-backend || pm2 start src/server.js --name "bmi-backend"
          pm2 save

      # --- 3. FRONTEND DEPLOYMENT ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build

      - name: Deploy Frontend Files to Nginx Directory
        run: |
          sudo rm -rf /var/www/bmi-frontend/*
          sudo cp -r frontend/dist/* /var/www/bmi-frontend/
          sudo chown -R www-data:www-data /var/www/bmi-frontend

      # --- 4. NGINX REVERSE PROXY CONFIGURATION ---
      - name: Setup Nginx Server Block
        run: |
          # ডিফল্ট Nginx কনফিগারেশন ফাইলে রিভার্স প্রক্সি সেটআপ (যদি অলরেডি করা না থাকে)
          sudo bash -c 'cat > /etc/nginx/sites-available/default << '\''EOF'\''
          server {
              listen 80;
              server_name _;

              root /var/www/bmi-frontend;
              index index.html index.htm;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Backend API Proxy (যদি ফ্রন্টএন্ড থেকে /api দিয়ে কল করা হয়)
              location /api/ {
                  proxy_pass http://localhost:3000/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection '\''upgrade'\'';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          '\'
          
      - name: Test Nginx Configuration and Reload
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Deployment and Nginx configuration completed successfully!"