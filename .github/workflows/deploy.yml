steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Deploy Script on AWS Private Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRIVATE_SERVER_IP }}
          username: ${{ secrets.PRIVATE_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_URL,FRONTEND_URL
          script: |
            cd ~/projects/single-server-3tier-webapp
            sed -i -e 's/\r$//' deploy.sh
            chmod +x deploy.sh
            export DB_URL="${{ secrets.DATABASE_URL }}"
            export FRONTEND_URL="${{ secrets.PUBLIC_DOMAIN_OR_IP }}"
            ./deploy.sh